name: Internship Job Crawler

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions uses UTC. Run hourly; scheduled jobs can be delayed by GitHub.
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: internship-crawler
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r crawler/requirements.txt

      - name: Run tests
        run: pytest -q crawler/tests

      - name: Run crawler
        run: python crawler/main.py

      - name: Publish crawler results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawler/data/jobs.json crawler/data/seen.json crawler/data/new_jobs.json
          git diff --cached --quiet || git commit -m "chore: update internship listings"
          git push
